.label { font-size: 16px; }
.note { font-size: 14px; fill: #536174; }
.content { font-size: 18px; font-weight: 600; }
.dimension { stroke: #536174; stroke-width: 1; fill: none; }
.guide { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 5; }
</style>
