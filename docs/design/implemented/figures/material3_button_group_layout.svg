<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>Button group geometry: fixed gaps and conserved widths</title>
  <desc>Small round groups at density zero and 100% zoom, drawn at 1.5 SVG units per pixel. Standard gaps stay 12 pixels while the middle entry grows by 18 and its neighbours shrink by 9 each. Connected gaps stay 2 pixels; selection rounds the middle entry and pressing changes its inner radii to 4.</desc>
