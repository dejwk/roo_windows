  <text x="40" y="472" text-anchor="start" class="note" id="element-65">Each neighbour donates 9 px of horizontal padding.</text>
  <text x="40" y="497" text-anchor="start" class="note" id="element-66">12 px gaps remain open; content stays centred.</text>
  <text x="40" y="522" text-anchor="start" class="note" id="element-67">A content floor caps expansion when padding is scarce.</text>
  <text x="40" y="567" text-anchor="start" class="label" id="element-68">Conservation:</text>
  <text x="40" y="596" text-anchor="start" class="label" id="element-69">71 + 138 + 71 + 12 + 12 = 304 px</text>
