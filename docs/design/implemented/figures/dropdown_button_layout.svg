<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <title>DropdownButton natural and stretched content geometry</title>
  <desc>At double drawing scale, a 176 pixel natural width consists of 16 pixel padding, 112 pixel text lane, 8 pixel gap, 24 pixel chevron slot, and 16 pixel padding. Stretching to 280 pixels expands only the text lane. Both buttons are 40 pixels high.</desc>
  <style>
    text { font-family: sans-serif; fill: #243348; font-size: 14px; }
    .heading { font-size: 19px; font-weight: bold; }
    .small { font-size: 12px; }
    .edge { stroke: #62748a; stroke-width: 1; }
    .guide { stroke: #7c8da1; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect width="760" height="400" fill="white"/>
  <text x="32" y="28" class="heading">Stable preferred width; opposing text and chevron anchors</text>
  <text x="32" y="52">Dimensions in pixels at zoom 100%. Drawing scale: 2×.</text>
  <text x="40" y="84">Natural width: 176 = 16 + 112 + 8 + 24 + 16</text>
  <rect x="40" y="100" width="352" height="80" rx="24" fill="#f3f0fa" stroke="#685782" stroke-width="2"/>
  <rect x="72" y="108" width="224" height="64" fill="#dfeaf5"/>
  <rect x="312" y="108" width="48" height="64" fill="#e1e9d9"/>
  <text x="76" y="146" font-size="20">Automatic</text>
  <polygon points="324,134 336,146 348,134 350,136 336,150 322,136" fill="#413553"/>
  <line x1="40" y1="184" x2="40" y2="205" class="guide"/>
  <line x1="72" y1="175" x2="72" y2="205" class="guide"/>
  <line x1="296" y1="175" x2="296" y2="205" class="guide"/>
  <line x1="312" y1="175" x2="312" y2="205" class="guide"/>
  <line x1="360" y1="175" x2="360" y2="205" class="guide"/>
  <line x1="392" y1="184" x2="392" y2="205" class="guide"/>
  <text x="48" y="222" class="small">16</text>
  <text x="134" y="222" class="small">112: widest text</text>
  <text x="300" y="222" class="small">8</text>
  <text x="328" y="222" class="small">24</text>
  <text x="368" y="222" class="small">16</text>
  <text x="428" y="130">Height: 40</text>
  <text x="428" y="153">Text lane reserves the widest option.</text>
  <text x="428" y="175">Choosing shorter text preserves width.</text>
  <text x="40" y="252">Stretched width: 280 = 16 + 216 + 8 + 24 + 16</text>
  <rect x="40" y="268" width="560" height="80" rx="24" fill="#f3f0fa" stroke="#685782" stroke-width="2"/>
  <rect x="72" y="276" width="432" height="64" fill="#dfeaf5"/>
  <rect x="520" y="276" width="48" height="64" fill="#e1e9d9"/>
  <text x="76" y="314" font-size="20">Off</text>
  <polygon points="532,302 544,314 556,302 558,304 544,318 530,304" fill="#413553"/>
  <text x="40" y="380">Blue: text lane (left aligned). Green: fixed chevron slot (right aligned).</text>
</svg>
