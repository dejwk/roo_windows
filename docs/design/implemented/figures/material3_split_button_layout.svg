<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Split-button child geometry, menu anchor, and midpoint decoration clips</title>
  <desc id="desc">Small size at 100 percent zoom, enlarged three times. Both states have a 92 pixel primary segment, a 2 pixel gap, and a 48 pixel trailing segment, at height 40 pixels. Click progress rotates the chevron about a fixed center. Opening keeps it up and changes the trailing corners, never its rectangle. Two child buttons use existing surface rendering. Decoration clips meet halfway through the gap, preventing shadow overlap while preserving outward overflow.</desc>
  <rect width="960" height="700" fill="white"/>
  <style>
    text { font-family: sans-serif; fill: #202633; }
    .title { font-size: 21px; font-weight: 600; }
    .heading { font-size: 16px; font-weight: 600; }
    .body { font-size: 14px; }
    .note { font-size: 13px; fill: #4d5667; }
    .surface { fill: #e8def8; }
    .open { fill: #d9cbed; }
    .guide { stroke: #677486; stroke-width: 1; fill: none; }
    .anchor { stroke: #196f9b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .chevron { fill: #302b3e; }
    .arrow { stroke: #677486; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#677486"/>
    </marker>
  </defs>

  <text x="32" y="34" class="title">A transparent container with two child buttons</text>
  <text x="32" y="58" class="note">Small · LTR · density 0 · zoom 100% · drawing scale 3:1 · label/artwork schematic</text>
  <text x="60" y="92" class="heading">Closed</text>

  <!-- L=92, gap=2, T=48, H=40. At 3:1: 276 + 6 + 144, height 120. -->
  <g transform="translate(60 110)">
    <!-- Outer radius 20*3=60, inner radius 4*3=12. -->
    <path class="surface" d="M60 0 H264 A12 12 0 0 1 276 12 V108 A12 12 0 0 1 264 120 H60 A60 60 0 0 1 0 60 A60 60 0 0 1 60 0 Z"/>
    <path class="surface" d="M294 0 H366 A60 60 0 0 1 426 60 A60 60 0 0 1 366 120 H294 A12 12 0 0 1 282 108 V12 A12 12 0 0 1 294 0 Z"/>
    <rect x="48" y="24" width="192" height="72" rx="2" class="anchor"/>
    <text x="144" y="72" font-size="32" text-anchor="middle">Run</text>
    <!-- Fixed center (354, 60); exact 22 px slot chevron at 3:1. -->
    <path class="chevron" d="M341.389 49.805 L337.500 53.695 L354.000 70.195 L370.500 53.695 L366.611 49.805 L354.000 62.416 Z"/>
    <path class="guide" d="M0 132 V150 M276 132 V150 M282 132 V150 M426 132 V150 M0 145 H276 M282 145 H426"/>
    <text x="138" y="168" class="body" text-anchor="middle">primary L = 92 px</text>
    <text x="354" y="168" class="body" text-anchor="middle">T = 48 px</text>
  </g>
  <path class="arrow" d="M534 132 H507 L414 162"/>
  <text x="546" y="132" class="body">Chevron rotates around a fixed center.</text>
  <text x="546" y="155" class="note">Rotation = π × shared click progress.</text>
  <text x="546" y="185" class="body">Primary content cluster: 64 × 24 px.</text>
  <text x="546" y="208" class="note">Start/end padding: 16 / 12 px.</text>
  <text x="546" y="241" class="body">Total width: 92 + 2 + 48 = 142 px.</text>
  <text x="546" y="264" class="note">Both child heights: 40 px.</text>
  <!-- Common clip boundary: x=60 + 3*(92+1)=339; surface edges 336 and 342. -->
  <path d="M339 100 V238 M339 356 V494" stroke="#b04428" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path class="arrow" d="M339 301 V240"/>
  <text x="60" y="310" class="note">2 px gap; one shadow clip gets each half</text>

  <text x="60" y="350" class="heading">Menu open</text>
  <g transform="translate(60 366)">
    <path class="surface" d="M60 0 H264 A12 12 0 0 1 276 12 V108 A12 12 0 0 1 264 120 H60 A60 60 0 0 1 0 60 A60 60 0 0 1 60 0 Z"/>
    <!-- Same x=282..426, now full radius 60 on all four corners. -->
    <rect x="282" y="0" width="144" height="120" rx="60" class="open"/>
    <text x="144" y="72" font-size="32" text-anchor="middle">Run</text>
    <path class="chevron" d="M366.611 70.195 L370.500 66.305 L354.000 49.805 L337.500 66.305 L341.389 70.195 L354.000 57.584 Z"/>
    <rect x="282" y="0" width="144" height="120" class="anchor"/>
  </g>
  <path class="arrow" d="M535 404 H495 L467 409"/>
  <text x="546" y="399" class="body">Full trailing corners; centered up chevron.</text>
  <text x="546" y="422" class="note">Rectangle and gap remain unchanged.</text>
  <text x="546" y="455" class="body">Dashed rectangle is the menu anchor.</text>
  <text x="546" y="478" class="note">Translate its local bounds to window space.</text>
  <path class="guide" d="M342 489 V504"/>
  <rect x="342" y="504" width="190" height="58" rx="10" fill="#f6f1fa" stroke="#91869e"/>
  <text x="358" y="527" class="body">Run once</text>
  <text x="358" y="548" class="body">Configure run</text>
  <text x="60" y="543" class="note">Below-start placement</text>
  <path class="arrow" d="M240 538 H330"/>

  <text x="32" y="601" class="heading">Existing child rendering; decoration clips meet in the gap</text>
  <rect x="32" y="620" width="260" height="55" rx="6" fill="#edf3fa"/>
  <text x="47" y="643" class="body">1. Segment foreground</text>
  <text x="47" y="663" class="note">Primary content / procedural chevron.</text>
  <path class="arrow" d="M300 647 H323"/>
  <rect x="332" y="620" width="260" height="55" rx="6" fill="#edf3fa"/>
  <text x="347" y="643" class="body">2. Per-corner decoration</text>
  <text x="347" y="663" class="note">Reuse rounded fill, outline, and shadow.</text>
  <path class="arrow" d="M600 647 H623"/>
  <rect x="632" y="620" width="296" height="55" rx="6" fill="#edf3fa"/>
  <text x="647" y="643" class="body">3. Clip at the gap midpoint</text>
  <text x="647" y="663" class="note">Keep outer overflow and backdrop.</text>
</svg>
