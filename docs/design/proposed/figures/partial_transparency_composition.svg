  <rect x="100" y="145" width="150" height="90" rx="28" fill="#3b82f6" fill-opacity="0.55"/>
  <text x="110" y="130">Current translucent ink</text>
  <path d="M270 185h65" stroke="#475569" marker-end="url(#arrow)" stroke-width="2"/>
  <text x="268" y="212" class="small">Old ink removed</text>
  <path d="M102 238L82 266" stroke="#475569" stroke-width="1.5"/>
  <text x="54" y="286" class="small">Rounded corner still needs the backdrop</text>
  <text x="40" y="352" class="small">Dashed rectangle = old ink bounds union new ink bounds</text>
  <text x="40" y="375" class="small">Neither widget bounds nor damage prove opaque coverage.</text>
  <text x="510" y="34" class="title">Traversal and output</text>
  <rect x="515" y="66" width="485" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="534" y="94" class="step">1. Before paint</text>
  <text x="534" y="119">Invalidate changed ink and the scene beneath it.</text>
  <path d="M757 142h2v25h5l-6 9-6-9h5z" fill="#475569"/>
  <rect x="515" y="181" width="485" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="534" y="209" class="step">2. Traverse foreground before background</text>
  <text x="534" y="234">Register current ink; repaint invalidated lower content.</text>
  <path d="M757 257h2v25h5l-6 9-6-9h5z" fill="#475569"/>
  <rect x="515" y="296" width="485" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="534" y="324" class="step">3. Compose before device output</text>
  <text x="534" y="349">Blend foreground with fresh backdrop; emit final colors.</text>
  <text x="515" y="410">The alpha source can be a custom rasterizer,</text>
  <text x="515" y="433">a stack, or a cached procedural illustration.</text>
  <text x="515" y="466" class="small">No intermediate clear is sent to the display.</text>
</svg>
