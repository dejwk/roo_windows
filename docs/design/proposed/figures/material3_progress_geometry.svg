<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-labelledby="title desc">
<title id="title">Progress indicator geometry and paint ownership</title>
<desc id="desc">Half-complete linear and circular indicators. Colored shapes are foreground; gaps and the circle center reveal the ancestor. Dashed boxes bound invalidation.</desc>
<rect width="760" height="426" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#253047">
<text x="24" y="28" font-size="18">Determinate geometry at p = 0.5</text>
<text x="24" y="55">Linear: 240 dp width, 4 dp stroke (2 drawing units per dp)</text>
<rect x="40" y="87" width="480" height="10" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
<rect x="40" y="88" width="240" height="8" rx="4" fill="#6750a4"/>
<rect x="288" y="88" width="232" height="8" rx="4" fill="#e8def8"/>
<circle cx="516" cy="92" r="4" fill="#6750a4"/>
<path d="M280 83 V70 H288 V83" fill="none" stroke="#253047"/>
<text x="304" y="75">4 dp clear gap</text>
<text x="40" y="122">Active extent = p × width = 120 dp</text>
<path d="M516 102 V134 H551" fill="none" stroke="#64748b"/>
<text x="560" y="139">4 dp end stop</text>
<text x="24" y="169">Circular: 40 dp ink diameter inside a 48 dp footprint (4 units per dp)</text>
<rect x="64" y="196" width="192" height="192" fill="none" stroke="#cbd5e1"/>
<rect x="80" y="212" width="160" height="160" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
<path d="M160 220 A72 72 0 0 1 160 364" fill="none" stroke="#6750a4" stroke-width="16" stroke-linecap="round"/>
<path d="M129.0431 357.0052 A72 72 0 0 1 129.0431 226.9948" fill="none" stroke="#e8def8" stroke-width="16" stroke-linecap="round"/>
<path d="M160 292 H302" fill="none" stroke="#64748b"/>
<text x="316" y="287">Center and both gaps reveal the ancestor</text>
<text x="316" y="314">Centerline radius = (40 − 4) / 2 = 18 dp</text>
<text x="316" y="341">Rounded caps: 2 dp radius</text>
<text x="316" y="368">Dashed box: bounded invalidation, not opaque fill</text>
<text x="24" y="414" font-size="12">Geometry diagram; colors identify foreground roles, not exact raster output.</text>
</g></svg>