<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800">
<rect width="1040" height="800" fill="white"/>
<style>text {font: 16px sans-serif; fill: #243047} .title {font-size:24px;font-weight:600} .surface {fill:#e8def8;stroke:#675080;stroke-width:1} .icon {fill:#675080} .label {fill:#9582b1}</style>
<text x="32" y="40" class="title">Material 3 FAB sizes and collapse geometry</text>
<text x="32" y="72">Geometry drawn at 2 px/dp. Filled icon squares denote slots, not required artwork sizes.</text>
<rect x="48" y="230" width="80" height="80" rx="24" class="surface"/>
<rect x="64" y="246" width="48" height="48" rx="0" class="icon"/>
<text x="48" y="342">Small</text>
<text x="48" y="367">40 dp / icon 24 / radius 12</text>
<rect x="280" y="198" width="112" height="112" rx="32" class="surface"/>
<rect x="312" y="230" width="48" height="48" rx="0" class="icon"/>
<text x="280" y="342">Regular</text>
<text x="280" y="367">56 dp / icon 24 / radius 16</text>
<rect x="512" y="150" width="160" height="160" rx="40" class="surface"/>
<rect x="564" y="202" width="56" height="56" rx="0" class="icon"/>
<text x="512" y="342">Medium</text>
<text x="512" y="367">80 dp / icon 28 / radius 20</text>
<rect x="768" y="118" width="192" height="192" rx="56" class="surface"/>
<rect x="832" y="182" width="64" height="64" rx="0" class="icon"/>
<text x="768" y="342">Large</text>
<text x="768" y="367">96 dp / icon 32 / radius 28</text>
<text x="32" y="411">Extended family: sample label advance t = 60 dp; bars denote measured text width.</text>
<rect x="48" y="446" width="248" height="112" rx="32" class="surface"/>
<rect x="80" y="478" width="48" height="48" rx="0" class="icon"/>
<rect x="144" y="492" width="120" height="20" rx="0" class="label"/>
<text x="440" y="491">Small: width 124, height 56 dp</text>
<text x="440" y="517">padding 16/16, gap 8 dp</text>
<rect x="800" y="446" width="112" height="112" rx="32" class="surface"/>
<rect x="832" y="478" width="48" height="48" rx="0" class="icon"/>
<rect x="48" y="580" width="304" height="160" rx="40" class="surface"/>
<rect x="100" y="632" width="56" height="56" rx="0" class="icon"/>
<rect x="180" y="650" width="120" height="20" rx="0" class="label"/>
<text x="440" y="625">Medium: width 152, height 80 dp</text>
<text x="440" y="651">padding 26/26, gap 12 dp</text>
<rect x="800" y="580" width="160" height="160" rx="40" class="surface"/>
<rect x="852" y="632" width="56" height="56" rx="0" class="icon"/>
<text x="32" y="778">Large uses height 96, icon 32, radius 28, padding 28/28, gap 16 dp; collapses to 96 × 96 dp.</text>
</svg>
