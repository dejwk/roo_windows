<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
  <title>Segmented button cell allocation and rounded owner composition</title>
  <desc>At unit zoom, three 96 pixel cells and two 1 pixel separator allocations form a 290 by 40 pixel group. The drawing magnifies each coordinate by two. Children occupy full-height rectangles; a shared owner mask and outline form the pill.</desc>
  <defs>
    <clipPath id="pill"><rect x="60" y="110" width="580" height="80" rx="40"/></clipPath>
  </defs>
  <rect width="940" height="430" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 20px; font-weight: bold; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #4b5056; }
    .content { font-size: 18px; }
    .guide { stroke: #5f6368; stroke-width: 1; fill: none; }
  </style>
  <text x="40" y="32" class="title">One rounded owner; rectangular child cells</text>
  <text x="40" y="58" class="label">W = 3 × 96 + 2 × 1 = 290 px, H = 40 px at unit zoom. Drawing scale: 2×.</text>

  <path d="M 60 98 V 86 H 640 V 98" class="guide"/>
  <text x="350" y="80" text-anchor="middle" class="small">290 px total; outer stroke included in the end cells</text>

  <g clip-path="url(#pill)">
    <rect x="60" y="110" width="192" height="80" fill="#f6f3f8"/>
    <rect x="254" y="110" width="192" height="80" fill="#e8def8"/>
    <rect x="448" y="110" width="192" height="80" fill="#f6f3f8"/>
    <rect x="252" y="110" width="2" height="80" fill="#79747e"/>
    <rect x="446" y="110" width="2" height="80" fill="#79747e"/>
  </g>
  <!-- A centered 2px stroke on this inset rect occupies the exact outer 2px band. -->
  <rect x="61" y="111" width="578" height="78" rx="39" fill="none" stroke="#79747e" stroke-width="2"/>
  <text x="156" y="157" text-anchor="middle" class="content">Day</text>
  <text x="350" y="157" text-anchor="middle" class="content">✓ Week</text>
  <text x="544" y="157" text-anchor="middle" class="content">Month</text>

  <path d="M 60 200 V 212 H 252 V 200 M 254 200 V 212 H 446 V 200 M 448 200 V 212 H 640 V 200" class="guide"/>
  <text x="156" y="234" text-anchor="middle" class="small">cell 0: [0, 96)</text>
  <text x="350" y="234" text-anchor="middle" class="small">cell 1: [97, 193)</text>
  <text x="544" y="234" text-anchor="middle" class="small">cell 2: [194, 290)</text>

  <path d="M 615 122 H 672" class="guide"/>
  <text x="685" y="119" class="label">Group outline: 1 px</text>
  <text x="685" y="140" class="small">Rounded mask clips child fill.</text>
  <path d="M 447 184 V 257 H 672" class="guide"/>
  <text x="685" y="252" class="label">Separator bands: 1 px</text>
  <text x="685" y="273" class="small">No child fill or touch target.</text>

  <text x="40" y="293" class="label">RTL mirrors these cells and bands; logical indices and selection bits stay unchanged.</text>
  <rect x="40" y="315" width="860" height="88" rx="6" fill="#f2f4f7"/>
  <text x="56" y="338" class="label">Render through the existing rounded-owner compositor:</text>
  <text x="56" y="360" class="small">Child content + state layer + fill → settled exclusions; group bands → settled exclusions;</text>
  <text x="56" y="382" class="small">remaining surface and outer decoration resolve coverage with the backdrop before final output.</text>
</svg>
