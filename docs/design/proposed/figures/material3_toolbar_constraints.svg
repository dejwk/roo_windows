<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Constraint fallback and surface painting</title>
  <rect x="0" y="0" width="1100" height="780" rx="0" fill="#ffffff" stroke="none" />
  <text x="40" y="42" font-size="25" fill="#334155" font-weight="bold" text-anchor="start">Constraint fallback and surface painting</text>
  <text x="40" y="74" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Group widths are 88, 88, 40; two 16 px gaps give packed length L = 248.</text>
  <text x="40" y="119" font-size="20" fill="#334155" font-weight="bold" text-anchor="start">Edge collision, but centered content fits</text>
  <text x="590" y="119" font-size="20" fill="#334155" font-weight="bold" text-anchor="start">Packed content exceeds the available width</text>
  <text x="40" y="150" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">W = 272, inner A = 256</text>
  <text x="590" y="150" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">W = 256, inner A = 240</text>
  <g transform="translate(40 177) scale(1.5)">
    <rect x="0" y="0" width="272" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="8" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="52.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="92" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="136.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="224" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="244.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
  </g>
  <text x="40" y="298" font-size="15" fill="#a33232" font-weight="normal" text-anchor="start">Candidate x = 8, 92, 224: L and C overlap by 4 px.</text>
  <text x="40" y="327" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Fall back to centered; E = 8, start = 8 + E/2 = 12.</text>
  <g transform="translate(40 350) scale(1.5)">
    <rect x="0" y="0" width="272" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="12" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="56.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="116" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="160.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="220" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="240.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
    <rect x="107" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <rect x="211" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
  </g>
  <text x="40" y="473" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Result x = 12, 116, 220; both group gaps are 16 px.</text>
  <g transform="translate(590 177) scale(1.5)">
    <rect x="0" y="0" width="256" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="8" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="52.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="112" y="12" width="88" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="156.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="216" y="12" width="32" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="232.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
    <rect x="248" y="12" width="8" height="40" rx="0" fill="#ffe3c4" stroke="none" />
    <rect x="103" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <rect x="207" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <line x1="248" y1="-8" x2="248" y2="72" stroke="#c05621" stroke-width="1" stroke-dasharray="3 2" />
  </g>
  <text x="590" y="298" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Start packing at x = 8; later groups start at 112, 216.</text>
  <text x="590" y="327" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Content ends at x = 248. Only 32 px of T remain.</text>
  <text x="590" y="370" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">No negative gaps, overlap, wrapping, or auto-menu.</text>
  <text x="590" y="398" font-size="15" fill="#a34a1d" font-weight="normal" text-anchor="start">The orange 8 px lie outside the content boundary.</text>
  <text x="590" y="446" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Applications choose a fitting action set and a menu</text>
  <text x="590" y="473" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">before presenting the interactive toolbar.</text>
  <line x1="40" y1="506" x2="1060" y2="506" stroke="#d5dae2" />
  <text x="40" y="548" font-size="20" fill="#334155" font-weight="bold" text-anchor="start">Each stage writes only unresolved pixels</text>
  <text x="40" y="586" font-size="18" fill="#334155" font-weight="bold" text-anchor="start">1  Child controls</text>
  <rect x="40" y="606" width="300" height="76" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <rect x="54" y="624" width="60" height="40" rx="10" fill="#c9daf8" stroke="#416da8" />
  <rect x="160" y="624" width="60" height="40" rx="10" fill="#c9daf8" stroke="#416da8" />
  <rect x="266" y="624" width="60" height="40" rx="10" fill="#c9daf8" stroke="#416da8" />
  <text x="40" y="709" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Existing child exclusions stay active.</text>
  <text x="400" y="586" font-size="18" fill="#334155" font-weight="bold" text-anchor="start">2  Dividers</text>
  <rect x="400" y="606" width="300" height="76" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <rect x="496" y="632" width="2" height="24" rx="0" fill="#756c80" stroke="none" />
  <rect x="602" y="632" width="2" height="24" rx="0" fill="#756c80" stroke="none" />
  <text x="400" y="709" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Draw final colors, then exclude.</text>
  <text x="760" y="586" font-size="18" fill="#334155" font-weight="bold" text-anchor="start">3  Toolbar surface</text>
  <rect x="760" y="606" width="300" height="76" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <rect x="761" y="607" width="298" height="74" rx="0" fill="#e8e4ee" stroke="none" />
  <rect x="774" y="624" width="60" height="40" rx="10" fill="#ffffff" stroke="none" />
  <rect x="880" y="624" width="60" height="40" rx="10" fill="#ffffff" stroke="none" />
  <rect x="986" y="624" width="60" height="40" rx="10" fill="#ffffff" stroke="none" />
  <rect x="856" y="632" width="2" height="24" rx="0" fill="#ffffff" stroke="none" />
  <rect x="962" y="632" width="2" height="24" rx="0" fill="#ffffff" stroke="none" />
  <text x="760" y="709" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Fill the remaining background.</text>
  <text x="40" y="754" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Paint sequence is schematic. The inherited container traversal owns child stacking and rounded masks.</text>
</svg>