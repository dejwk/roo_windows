<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="494" viewBox="0 0 1060 494">
  <title>Two child scans, one paint per child</title>
  <desc>An interleaved collection C0 U1 C2 U3 is scanned in descending index order twice. The first scan paints U3 U1 with ancestor clips. The second paints C2 C0 with the parent's clip added. The parent surface follows, then its rounded decoration is published.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526174"/></marker></defs>
  <rect width="1060" height="494" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#182538">
    <text x="24" y="34" font-size="22" font-weight="bold">Two child scans, one paint per child</text>
    <text x="24" y="63" font-size="15">U = unclipped child and its subtree; C = clipped child and its subtree.</text>
    <text x="24" y="104" font-size="16">Collection order</text>
    <text x="680" y="104" font-size="15">Back to front; storage stays unchanged</text>
    <text x="24" y="180" font-size="16" font-weight="bold">Scan 1</text>
    <text x="680" y="180" font-size="15">Only ancestor clips apply</text>
    <text x="24" y="259" font-size="16" font-weight="bold">Scan 2</text>
    <text x="680" y="259" font-size="15">Parent clip + ancestor clips apply</text>

<rect x="224" y="81" width="84" height="36" rx="5" fill="#dbe7fb" stroke="#8795a5"/>
<text x="266" y="105" font-size="17" text-anchor="middle" fill="#182538">C0</text>
<path d="M312 99 H329" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="334" y="81" width="84" height="36" rx="5" fill="#fbe0c4" stroke="#8795a5"/>
<text x="376" y="105" font-size="17" text-anchor="middle" fill="#182538">U1</text>
<path d="M422 99 H439" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="444" y="81" width="84" height="36" rx="5" fill="#dbe7fb" stroke="#8795a5"/>
<text x="486" y="105" font-size="17" text-anchor="middle" fill="#182538">C2</text>
<path d="M532 99 H549" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="554" y="81" width="84" height="36" rx="5" fill="#fbe0c4" stroke="#8795a5"/>
<text x="596" y="105" font-size="17" text-anchor="middle" fill="#182538">U3</text>
<rect x="224" y="156" width="84" height="36" rx="5" fill="#fbe0c4" stroke="#8795a5"/>
<text x="266" y="180" font-size="17" text-anchor="middle" fill="#182538">U3</text>
<text x="266" y="211" font-size="13" text-anchor="middle" fill="#182538">paint</text>
<path d="M312 174 H329" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="334" y="156" width="84" height="36" rx="5" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="376" y="180" font-size="17" text-anchor="middle" fill="#89929e">C2</text>
<text x="376" y="211" font-size="13" text-anchor="middle" fill="#89929e">skip</text>
<path d="M422 174 H439" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="444" y="156" width="84" height="36" rx="5" fill="#fbe0c4" stroke="#8795a5"/>
<text x="486" y="180" font-size="17" text-anchor="middle" fill="#182538">U1</text>
<text x="486" y="211" font-size="13" text-anchor="middle" fill="#182538">paint</text>
<path d="M532 174 H549" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="554" y="156" width="84" height="36" rx="5" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="596" y="180" font-size="17" text-anchor="middle" fill="#89929e">C0</text>
<text x="596" y="211" font-size="13" text-anchor="middle" fill="#89929e">skip</text>
<rect x="224" y="235" width="84" height="36" rx="5" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="266" y="259" font-size="17" text-anchor="middle" fill="#89929e">U3</text>
<text x="266" y="290" font-size="13" text-anchor="middle" fill="#89929e">skip</text>
<path d="M312 253 H329" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="334" y="235" width="84" height="36" rx="5" fill="#dbe7fb" stroke="#8795a5"/>
<text x="376" y="259" font-size="17" text-anchor="middle" fill="#182538">C2</text>
<text x="376" y="290" font-size="13" text-anchor="middle" fill="#182538">paint</text>
<path d="M422 253 H439" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="444" y="235" width="84" height="36" rx="5" fill="#f5f5f5" stroke="#d4d8de"/>
<text x="486" y="259" font-size="17" text-anchor="middle" fill="#89929e">U1</text>
<text x="486" y="290" font-size="13" text-anchor="middle" fill="#89929e">skip</text>
<path d="M532 253 H549" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
<rect x="554" y="235" width="84" height="36" rx="5" fill="#dbe7fb" stroke="#8795a5"/>
<text x="596" y="259" font-size="17" text-anchor="middle" fill="#182538">C0</text>
<text x="596" y="290" font-size="13" text-anchor="middle" fill="#182538">paint</text>
<path d="M160 192 V238" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
    <path d="M160 274 V324" stroke="#526174" fill="none" marker-end="url(#arrow)"/>
    <rect x="24" y="330" width="1012" height="51" rx="5" fill="#edf3ee" stroke="#8795a5"/>
    <text x="42" y="361" font-size="16">Parent surface with parent clip → restore ancestor context → publish rounded decoration</text>
    <text x="24" y="415" font-size="16" font-weight="bold">Effective foreground-to-background order: U3, U1, C2, C0, parent surface</text>
    <text x="24" y="441" font-size="14">Retained exclusions and overlays protect the foreground. Each group keeps descending index order.</text>
    <text x="24" y="476" font-size="14">Shown: mayHaveUnclippedChildren() == true. When false, skip scan 1; scan 2 visits every child once.</text>
  </g>
</svg>
