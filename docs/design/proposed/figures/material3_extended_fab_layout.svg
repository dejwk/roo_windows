<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340">
<rect width="940" height="340" fill="white"/>
<style>text {font: 16px sans-serif; fill: #243047} .title {font-size:24px;font-weight:600} .surface {fill:#e8def8;stroke:#675080;stroke-width:1} .icon {fill:#675080} .label {fill:#9582b1}</style>
<text x="32" y="40" class="title">Expressive small extended FAB: expanded and collapsed</text>
<text x="32" y="72">2 px/dp; sample label advance = 60 dp. All rectangles follow the family width equation.</text>
<rect x="64" y="112" width="248" height="112" rx="32" class="surface"/>
<rect x="96" y="144" width="48" height="48" rx="0" class="icon"/>
<rect x="160" y="148" width="120" height="40" rx="0" class="label"/>
<text x="64" y="254">16 + 24 + 8 + 60 + 16 = 124 dp</text>
<text x="382" y="171">collapse →</text>
<rect x="560" y="112" width="112" height="112" rx="32" class="surface"/>
<rect x="592" y="144" width="48" height="48" rx="0" class="icon"/>
<text x="556" y="254">56 × 56 dp</text>
<text x="32" y="301">Height 56 dp; radius 16 dp; icon required; label retained when collapsed.</text>
</svg>
