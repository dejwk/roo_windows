<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Toolbar layout at 100% zoom</title>
  <rect x="0" y="0" width="1100" height="680" rx="0" fill="#ffffff" stroke="none" />
  <text x="40" y="42" font-size="25" fill="#334155" font-weight="bold" text-anchor="start">Toolbar layout at 100% zoom</text>
  <text x="40" y="73" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Geometry uses measured child bounds; shadows and host margins are outside these surfaces.</text>
  <text x="40" y="118" font-size="20" fill="#334155" font-weight="bold" text-anchor="start">Docked · W = 320, H = 64</text>
  <text x="610" y="118" font-size="20" fill="#334155" font-weight="bold" text-anchor="start">Floating · three 40 × 40 controls</text>
  <text x="40" y="150" font-size="17" fill="#334155" font-weight="bold" text-anchor="start">Evenly spaced</text>
  <g transform="translate(40 163) scale(1.5)">
    <rect x="0" y="0" width="320" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="8" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="28.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="140" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="160.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="272" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="292.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
    <rect x="93" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <rect x="225" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
  </g>
  <text x="40" y="283" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">x = 8, 140, 272; spare space expands the gaps</text>
  <text x="40" y="314" font-size="17" fill="#334155" font-weight="bold" text-anchor="start">Centered</text>
  <g transform="translate(40 327) scale(1.5)">
    <rect x="0" y="0" width="320" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="84" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="104.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="140" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="160.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="196" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="216.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
    <rect x="131" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <rect x="187" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
  </g>
  <text x="40" y="447" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">x = 84, 140, 196; 16 px group gaps</text>
  <text x="40" y="478" font-size="17" fill="#334155" font-weight="bold" text-anchor="start">Edge anchored</text>
  <g transform="translate(40 491) scale(1.5)">
    <rect x="0" y="0" width="320" height="64" rx="0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="8" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="28.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">L</text>
    <rect x="140" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="160.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">C</text>
    <rect x="272" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="292.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">T</text>
    <rect x="93" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
    <rect x="225" y="20" width="1" height="24" rx="0" fill="#756c80" stroke="none" />
  </g>
  <text x="40" y="611" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">x = 8, 140, 272; C stays centered in the surface</text>
  <text x="610" y="155" font-size="17" fill="#334155" font-weight="normal" text-anchor="start">Horizontal: 144 × 64, radius 32</text>
  <g transform="translate(610 177) scale(2)">
    <rect x="0" y="0" width="144" height="64" rx="32.0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="8" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="28.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">1</text>
    <rect x="52" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="72.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">2</text>
    <rect x="96" y="12" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="116.0" y="36" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">3</text>
  </g>
  <text x="610" y="337" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">8 + 40 + 4 + 40 + 4 + 40 + 8 = 144</text>
  <text x="610" y="365" font-size="16" fill="#334155" font-weight="normal" text-anchor="start">Child y = (64 − 40) / 2 = 12</text>
  <text x="610" y="429" font-size="17" fill="#334155" font-weight="normal" text-anchor="start">Vertical: 64 × 144</text>
  <g transform="translate(940 380) scale(1.75)">
    <rect x="0" y="0" width="64" height="144" rx="32.0" fill="#e8e4ee" stroke="#787083" stroke-width="0.7" />
    <rect x="12" y="8" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="32" y="32.0" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">1</text>
    <rect x="12" y="52" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="32" y="76.0" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">2</text>
    <rect x="12" y="96" width="40" height="40" rx="10" fill="#c9daf8" stroke="#416da8" stroke-width="0.7" />
    <text x="32" y="120.0" font-size="12" fill="#243f68" font-weight="normal" text-anchor="middle">3</text>
  </g>
  <text x="610" y="459" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">The same dimensions exchange axes.</text>
  <text x="610" y="487" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Top-to-bottom order remains 1, 2, 3.</text>
  <text x="610" y="539" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Surface size = max(64, child + 16)</text>
  <text x="610" y="567" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">on the cross axis.</text>
  <text x="40" y="651" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">Docked L, C, T are logical slots. RTL mirrors horizontal positions, including separators.</text>
</svg>