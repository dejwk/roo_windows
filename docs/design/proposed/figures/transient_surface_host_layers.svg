<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="#ffffff"/>
  <style>
    .title { font: 17px sans-serif; fill: #1f1f1f; }
    .label { font: 14px sans-serif; fill: #1f1f1f; }
    .small { font: 12px sans-serif; fill: #4a4a4a; }
    .window { fill: #faf7f2; stroke: #6b6257; stroke-width: 2; }
    .task { fill: #d7ebff; stroke: #2f6690; stroke-width: 2; }
    .pin { fill: #eadcff; stroke: #7351a3; stroke-width: 2; }
    .popup-host { fill: #f4fbf7; stroke: #1b7f5a; stroke-width: 2; }
    .dialog-host { fill: #d9d9d9; stroke: #1b7f5a; stroke-width: 2; }
    .surface { fill: #fff4dc; stroke: #8d6b2f; stroke-width: 2; }
    .arrow { stroke: #4a4a4a; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <text x="28" y="34" class="title">One reusable TransientHostLayer, two example profiles</text>
  <text x="28" y="56" class="small">An explicit attached Task owns focus, keys, Back context, and lifetime for the borrowed presenter root.</text>

  <text x="42" y="94" class="title">Menu profile</text>
  <rect x="28" y="108" width="438" height="370" rx="18" class="window"/>
  <text x="46" y="136" class="small">MainWindow</text>

  <rect x="58" y="158" width="378" height="168" rx="12" class="popup-host"/>
  <text x="76" y="184" class="label">Composite TransientHostLayer</text>
  <text x="76" y="205" class="small">transparent paint; declined root hits become outside input</text>
  <text x="76" y="226" class="small">borrowed MenuOverlay root; presenter-owned FocusScope</text>
  <rect x="206" y="236" width="202" height="70" rx="14" class="surface"/>
  <text x="228" y="264" class="label">Visible menu panel</text>
  <text x="228" y="286" class="small">outside activation dismisses</text>

  <rect x="90" y="344" width="196" height="30" rx="8" class="pin"/>
  <text x="108" y="364" class="small">optional owner-scoped trigger pin</text>
  <rect x="58" y="382" width="378" height="62" rx="10" class="task"/>
  <text x="78" y="409" class="label">Explicit interaction-owner Task</text>
  <text x="78" y="429" class="small">live placement and trigger sources must belong here</text>
  <line x1="410" y1="326" x2="410" y2="380" class="arrow"/>
  <text x="302" y="356" class="small">owner association</text>

  <text x="526" y="94" class="title">Basic dialog profile</text>
  <rect x="514" y="108" width="438" height="370" rx="18" class="window"/>
  <text x="532" y="136" class="small">MainWindow</text>

  <rect x="544" y="158" width="378" height="168" rx="12" class="dialog-host"/>
  <text x="562" y="184" class="label">Composite TransientHostLayer</text>
  <text x="562" y="205" class="small">scrim paint; outside input is absorbed</text>
  <rect x="630" y="226" width="206" height="80" rx="14" class="surface"/>
  <text x="654" y="258" class="label">Borrowed dialog card</text>
  <text x="654" y="280" class="small">dialog owns result semantics</text>

  <rect x="544" y="382" width="378" height="62" rx="10" class="task"/>
  <text x="564" y="409" class="label">Explicit interaction-owner Task</text>
  <text x="564" y="429" class="small">presenter supplies its mandatory FocusScope</text>
  <line x1="896" y1="326" x2="896" y2="380" class="arrow"/>
  <text x="788" y="356" class="small">owner association</text>

  <text x="28" y="506" class="small">Only one profile is active: both use the canonical window slot and the same display-wide composite layer.</text>
</svg>
