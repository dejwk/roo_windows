<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="white"/>
  <g font-family="sans-serif" font-size="15" fill="#202124">
    <text x="24" y="30" font-size="20">One segmented list, six logical rows</text>
    <text x="24" y="56">Illustration: row height h = 56 px, gap g = 2 px; total = 6×56 + 5×2 = 346 px.</text>
    <text x="24" y="92">Authored sections</text>
    <text x="286" y="92">Rendered row surfaces</text>
    <text x="585" y="92">Position and band owner</text>
    <g fill="#edf0f4" stroke="#a2a8b0">
      <rect x="24" y="110" width="214" height="56" rx="6"/>
      <rect x="24" y="168" width="214" height="114" rx="6"/>
      <rect x="24" y="284" width="214" height="56" rx="6"/>
      <rect x="24" y="342" width="214" height="114" rx="6"/>
    </g>
    <text x="38" y="143">Static A</text>
    <text x="38" y="205">Dynamic B: 2 rows</text>
    <text x="38" y="258" font-size="12">Empty section: no height</text>
    <text x="38" y="317">Static C</text>
    <text x="38" y="392">Dynamic D: 2 rows</text>
    <g fill="#e5dcf6">
      <path d="M310 110 H530 Q550 110 550 130 V162 Q550 166 546 166 H294 Q290 166 290 162 V130 Q290 110 310 110 Z"/>
      <rect x="290" y="168" width="260" height="56" rx="4"/>
      <rect x="290" y="226" width="260" height="56" rx="4"/>
      <rect x="290" y="284" width="260" height="56" rx="4"/>
      <rect x="290" y="342" width="260" height="56" rx="4"/>
      <path d="M294 400 H546 Q550 400 550 404 V436 Q550 456 530 456 H310 Q290 456 290 436 V404 Q290 400 294 400 Z"/>
    </g>
    <text x="308" y="143">A</text><text x="308" y="201">B0</text>
    <text x="308" y="259">B1</text><text x="308" y="317">C</text>
    <text x="308" y="375">D0</text><text x="308" y="433">D1</text>
    <text x="585" y="140">first — global top corners</text>
    <text x="585" y="198">middle</text><text x="585" y="256">middle</text>
    <text x="585" y="314">middle</text><text x="585" y="372">middle</text>
    <text x="585" y="430">last — global bottom corners</text>
    <g stroke="#666" fill="none">
      <path d="M550 167 H576 M550 225 H576 M550 283 H576 M550 341 H576 M550 399 H576"/>
    </g>
    <g font-size="12" fill="#555">
      <text x="585" y="171">List owns A → B0 band</text>
      <text x="585" y="229">B owns B0 → B1 band</text>
      <text x="585" y="287">List owns B1 → C band</text>
      <text x="585" y="345">List owns C → D0 band</text>
      <text x="585" y="403">D owns D0 → D1 band</text>
    </g>
    <text x="24" y="490">No band before A or after D1. Scrolling does not change which logical rows get end corners.</text>
  </g>
</svg>
