<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"
     viewBox="0 0 900 430">
  <rect width="900" height="430" fill="white"/>
  <style>
    text { font-family: sans-serif; fill: #202124; }
    .title { font-size: 18px; }
    .label { font-size: 15px; }
    .glyph { font-size: 70px; font-weight: 500; fill: #3949ab; }
    .box { fill: #e8eaf6; fill-opacity: 0.55; stroke: #5c6bc0;
           stroke-width: 1.5; }
    .ink { fill: none; stroke: #00897b; stroke-width: 2; }
    .baseline { stroke: #c62828; stroke-width: 2; }
    .measure { stroke: #5f6368; stroke-width: 1.5;
               marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #9aa0a6; stroke-width: 1; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#5f6368"/>
    </marker>
  </defs>

  <text x="35" y="30" class="title">Line boxes derived from an explicit line gap</text>

  <rect x="110" y="60" width="500" height="150" class="box"/>
  <rect x="110" y="210" width="500" height="150" class="box"/>
  <line x1="110" y1="160" x2="610" y2="160" class="baseline"/>
  <line x1="110" y1="310" x2="610" y2="310" class="baseline"/>

  <rect x="155" y="95" width="225" height="90" class="ink"/>
  <rect x="155" y="245" width="225" height="90" class="ink"/>
  <text x="165" y="168" class="glyph">Text</text>
  <text x="165" y="318" class="glyph">Text</text>

  <line x1="75" y1="60" x2="75" y2="210" class="measure"/>
  <text x="45" y="140" class="label">H</text>
  <line x1="650" y1="160" x2="650" y2="310" class="measure"/>
  <text x="665" y="240" class="label">baseline advance = H</text>

  <line x1="620" y1="95" x2="720" y2="95" class="guide"/>
  <line x1="620" y1="185" x2="720" y2="185" class="guide"/>
  <line x1="720" y1="95" x2="720" y2="185" class="measure"/>
  <text x="738" y="145" class="label">A − D</text>

  <text x="125" y="84" class="label">G = H − (A − D); top gap = floor(G / 2)</text>
  <text x="125" y="204" class="label">odd line-gap remainder stays below the glyph band</text>
  <text x="125" y="384" class="label">Line gap changes layout; the selected font and glyph pixels do not change.</text>
</svg>
