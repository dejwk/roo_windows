[platformio]
default_envs = double_optimized
src_dir = src

[env]
platform = /home/dawidk/.platformio/platforms/espressif32
board = lolin_s3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D ROO_WINDOWS_ZOOM=100
  -D CORE_DEBUG_LEVEL=0

[env:single_flash]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=0

[env:single_ram]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=0

[env:double_flash]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=2
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=0

[env:double_ram]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=2
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=0

[env:analytic]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=0

[env:double_optimized]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=2
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=1

[env:double_sides]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=2
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_GRADIENTS=1

[env:double_corners]
build_flags = ${env.build_flags}
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_COUNT=2
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_LUT_RAM=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_ANALYTIC=0
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_OPTIMIZED=1
  -D ROO_WINDOWS_EXPERIMENTAL_SHADOW_GRADIENTS=2

[env:double_optimized_cutoff2]
extends = env:double_optimized
build_flags = ${env:double_optimized.build_flags}
  -D ROO_WINDOWS_SHADOW_ALPHA_CUTOFF=2
