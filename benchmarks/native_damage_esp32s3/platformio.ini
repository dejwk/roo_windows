[platformio]
default_envs=hybrid
[env]
platform=/home/dawidk/.platformio/platforms/espressif32
board=lolin_s3
framework=arduino
board_build.partitions=default_16MB.csv
monitor_speed=115200
upload_port=/dev/ttyACM0
monitor_dtr=0
monitor_rts=0
build_flags=-DROO_WINDOWS_ZOOM=100 -DCORE_DEBUG_LEVEL=0
lib_deps=roo_windows=symlink://lib/roo_windows
[env:hybrid]
build_flags=${env.build_flags} -DROO_BENCH_NATIVE=0
[env:native]
build_flags=${env.build_flags} -DROO_BENCH_NATIVE=1
