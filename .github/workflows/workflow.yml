name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@afd219965d65e8d8bcc29b902220a4b19dea66a8 # roo_testing 2.0.0
    with:
      profiles: '["arduino"]'
      system_packages: libx11-dev libjpeg-dev libpng-dev zlib1g-dev
