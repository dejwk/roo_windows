name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyboard-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compiler and checked-in keyboard artifacts
        run: python3 tools/keyboard_layout/test_compile.py

  ci:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@e8d1ad9299d01eff945f417ac407df71d698bff5 # roo_testing 2.7.0
    with:
      profiles: '["arduino_esp32"]'
      system_packages: libx11-dev libjpeg-dev libpng-dev zlib1g-dev
